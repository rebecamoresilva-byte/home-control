<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<script>try{var t=localStorage.getItem("homecontrol_tema")||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");document.documentElement.setAttribute("data-theme",t);}catch(e){}</script>
<title>HOME CONTROL</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0f0f10">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">

<style>
:root{
  --bk:#0f0f10; --bk2:#1c1c1f; --bk3:#2a2a2e;
  --bg:#ffffff; --card:#ffffff; --g1:#f6f7f9; --g2:#e6e8ec; --g3:#d3d6dc;
  --tx:#141416; --mu:#6b7079; --fa:#9aa0a8;
  --gr:#16a34a; --grd:#13863d; --grl:#dcf5e3;
  --ye:#d97706; --yel:#fdf0d2; --or:#ea580c;
  --re:#dc2626; --rel:#fde2e2;
  --bl:#2563eb; --bll:#dbe7fd;
  --rad:10px;
  --hov:#fafbfc; --overbg:#fff5f5; --chbg:#f0faf3; --selbg:#eef6ff; --imgbg:linear-gradient(145deg,#f7f7f8,#eceef1);
  color-scheme: light;
}
/* TEMA ESCURO (fundo cinza) */
:root[data-theme="dark"]{
  --bg:#2a2c30; --card:#34363b; --g1:#3b3e44; --g2:#474a51; --g3:#5a5e66;
  --tx:#eceef1; --mu:#a9adb5; --fa:#80858e;
  --grl:#1f4a2f; --yel:#4d3a12; --rel:#4f2324; --bll:#24365a;
  --hov:#3a3d43; --overbg:#43292b; --chbg:#22402d; --selbg:#2c3d58; --imgbg:#ffffff;
  color-scheme: dark;
}
:root[data-theme="dark"] .p-gr{color:#a6e9bd}:root[data-theme="dark"] .p-ye{color:#f7d68b}:root[data-theme="dark"] .p-re{color:#ffb3b3}
:root[data-theme="dark"] .p-bl{color:#b8cdfa}:root[data-theme="dark"] .p-gy{color:#d5d8dd}:root[data-theme="dark"] .p-or{background:#5a3016;color:#ffc9a3}
:root[data-theme="dark"] .alert.y{color:#f5d996}:root[data-theme="dark"] .alert.r{color:#ffc4c4}:root[data-theme="dark"] .alert.g{color:#b5edc8}:root[data-theme="dark"] .alert.b{color:#c3d4fb}
:root[data-theme="dark"] .aviso{background:#45292b;border-color:#6b3a3c;color:#f3dede}
:root[data-theme="dark"] .aviso.ok{background:#22402d;border-color:#2f6a45;color:#d6f3e0}:root[data-theme="dark"] .aviso.ok .lb{color:#6ee29a}
:root[data-theme="dark"] .aviso.at{background:#4a3a17;border-color:#7a5e1d;color:#f6e6bf}:root[data-theme="dark"] .aviso.at .lb{color:#f2c14e}
:root[data-theme="dark"] .aviso.nt{background:#3b3e44;border-color:#555961;color:#e2e4e8}:root[data-theme="dark"] .aviso.nt .lb{color:#c4c8cf}
:root[data-theme="dark"] .aviso .lb{color:#ff8a8a}
:root[data-theme="dark"] .steps li > b{background:#22402d;color:#8fe3ad}
:root[data-theme="dark"] .t th{background:#1b1c1f}
:root[data-theme="dark"] .tab.on:not(.g),:root[data-theme="dark"] .bigtab.on,:root[data-theme="dark"] .cattab.on,:root[data-theme="dark"] .chipf.on,:root[data-theme="dark"] .btn.dark{background:#111214;border-color:#111214;color:#fff}
:root[data-theme="dark"] .sumtot{background:#4f2324}:root[data-theme="dark"] .sumtot.ok{background:#1f4a2f}
:root[data-theme="dark"] .ulist .avatar{background:#fff;color:#111}
:root[data-theme="dark"] .ph .ic{color:var(--tx)}
:root[data-theme="dark"] input[type=checkbox]{accent-color:var(--gr)}
.chart text:not([fill]),svg.donut text:not([fill]){fill:var(--tx)}
.themebtn{border:0;background:none;cursor:pointer;padding:6px;border-radius:8px;display:grid;place-items:center}
.themebtn:hover{background:var(--bk2)}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;font-size:13px;color:var(--tx);background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:200px 1fr;grid-template-rows:60px 1fr;height:100vh;transition:grid-template-columns .18s}
.menubtn{border:0;background:none;cursor:pointer;padding:6px;border-radius:8px;display:grid;place-items:center;margin-left:-8px}
.menubtn:hover{background:var(--bk2)}
.app.mini{grid-template-columns:68px 1fr}
.app.mini .side{padding:18px 8px}
.app.mini .nav{justify-content:center;padding:11px 0}
.app.mini .nav .lg,.app.mini .side-foot .t,.app.mini .ver{display:none}
.app.mini .side-foot button{text-align:center;padding:8px 0}
/* topo */
.top{grid-column:1/3;background:var(--bk);display:flex;align-items:center;padding:0 20px;gap:12px;color:#fff}
.top svg{width:30px;height:30px}
.top b{display:block;font-size:17px;letter-spacing:.5px;font-weight:800}
.top small{display:block;font-size:10.5px;color:#b9bcc3;margin-top:-1px}
.userbox{margin-left:auto;display:flex;align-items:center;gap:10px;cursor:pointer;padding:6px 10px;border-radius:9px}
.userbox:hover{background:var(--bk2)}
.avatar{width:32px;height:32px;border-radius:50%;background:#fff;color:var(--bk);display:grid;place-items:center;font-weight:800;font-size:13px;flex:0 0 32px}
.userbox .un{font-size:12.5px;font-weight:700;line-height:1.15}.userbox .ue{font-size:10.5px;color:#9ea2aa}
.login{position:fixed;inset:0;background:var(--bk);z-index:80;display:flex;align-items:center;justify-content:center;padding:20px}
.login .lbox{background:var(--card);border-radius:16px;width:min(420px,100%);padding:28px}
.login h2{margin:10px 0 2px;font-size:22px}
.ulist{display:flex;flex-direction:column;gap:6px;margin:12px 0}
.ulist button{display:flex;align-items:center;gap:10px;border:1px solid var(--g3);background:var(--card);border-radius:10px;padding:9px 12px;cursor:pointer;text-align:left}
.ulist button:hover{border-color:var(--bk)}
.ulist .avatar{background:var(--bk);color:#fff}
.mlist{display:none}
/* menu lateral */
.side{background:var(--bk);padding:18px 10px;display:flex;flex-direction:column;gap:6px;overflow:auto}
.nav{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:9px;color:#e9eaee;cursor:pointer;border:0;background:none;text-align:left;font-weight:600;font-size:13.5px;line-height:1.15}
.nav svg{width:26px;height:26px;flex:0 0 26px}
.nav:hover{background:var(--bk2)}
.nav.on{background:#fff;color:var(--bk)}
.side-foot{margin-top:auto;padding:10px 4px 0;border-top:1px solid var(--bk3);display:flex;flex-direction:column;gap:6px}
.side-foot button{background:var(--bk2);border:1px solid var(--bk3);color:#d8dae0;border-radius:8px;padding:8px 10px;text-align:left;cursor:pointer;font-size:12px}
.side-foot button:hover{background:var(--bk3)}
.ver{color:#6f737b;font-size:10.5px;padding:2px 4px}
/* principal */
main{overflow:auto;padding:18px 22px 30px;min-width:0}
.ph{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.ph .ic{width:44px;height:44px}
.ph h1{margin:0;font-size:21px;font-weight:800;letter-spacing:.2px;text-transform:uppercase}
.ph p{margin:2px 0 0;color:var(--mu);font-size:12.5px}
.ph .acts{margin-left:auto;display:flex;gap:8px;align-items:center}
.card{background:var(--card);border:1px solid var(--g2);border-radius:var(--rad);padding:14px;box-shadow:0 1px 3px rgba(16,24,40,.05)}
.card h3{margin:0 0 10px;font-size:13.5px;font-weight:700;display:flex;align-items:center;gap:8px}
.card h3 .r{margin-left:auto}
.grid{display:grid;gap:14px}
.muted{color:var(--mu)} .faint{color:var(--fa)} .small{font-size:11.5px}
.right{text-align:right} .center{text-align:center}
/* botões */
a.btn{text-decoration:none;color:inherit}a.btn.dark{color:#fff}
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--g3);background:var(--card);border-radius:8px;padding:7px 12px;cursor:pointer;font-weight:600;font-size:12.5px;white-space:nowrap}
.btn:hover{background:var(--g1)}
.btn.dark{background:var(--bk);border-color:var(--bk);color:#fff}
.btn.dark:hover{background:var(--bk3)}
.btn.green{background:var(--gr);border-color:var(--gr);color:#fff}
.btn.green:hover{background:var(--grd)}
.btn.red{color:var(--re);border-color:#f3b4b4}
.btn.sm{padding:4px 9px;font-size:11.5px}
.btn svg{width:16px;height:16px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.iconbtn{border:0;background:none;cursor:pointer;color:var(--mu);padding:3px;border-radius:6px}
.iconbtn:hover{background:var(--g1);color:var(--tx)}
/* KPIs */
.kpis{display:grid;gap:12px;margin-bottom:14px}
.kpi{background:var(--card);border:1px solid var(--g2);border-radius:var(--rad);padding:12px 14px;display:flex;align-items:center;gap:12px;position:relative}
.kpi .ki{width:40px;height:40px;border:1.5px solid var(--g3);border-radius:10px;display:grid;place-items:center;flex:0 0 40px}
.kpi .ki svg{width:22px;height:22px}
.kpi .kl{font-size:11px;color:var(--mu);font-weight:600}
.kpi .kv{font-size:19px;font-weight:800;margin-top:1px}
.kpi .ks{font-size:10.5px;color:var(--mu);margin-top:1px}
.kpi .edit{position:absolute;top:6px;right:6px}
.kpi.big{flex-direction:column;align-items:center;text-align:center;gap:4px;padding:14px 8px}
.kpi.big .kv{font-size:26px}
.kpi.big .ki{border:0;width:auto;height:auto}
.kpi.big .ki svg{width:30px;height:30px}
.c-gr{color:var(--gr)} .c-ye{color:var(--ye)} .c-re{color:var(--re)} .c-bl{color:var(--bl)}
/* tabs */
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.tab{border:1px solid var(--g3);background:var(--card);border-radius:9px;padding:9px 16px;cursor:pointer;font-weight:600;display:flex;align-items:center;gap:8px}
.tab.on{background:var(--bk);color:#fff;border-color:var(--bk)}
.tab.on.g{background:var(--gr);border-color:var(--gr)}
.tab svg{width:18px;height:18px}
.bigtabs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
.bigtab{border:1.5px solid var(--g3);background:var(--card);border-radius:10px;padding:10px;cursor:pointer;text-align:center}
.bigtab svg{width:28px;height:28px}
.bigtab b{display:block;font-size:14px}
.bigtab small{color:var(--mu);font-size:11px}
.bigtab.on{background:var(--bk);color:#fff;border-color:var(--bk)}
.bigtab.on small{color:#c9ccd2}
.cattabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:10px}
.cattab{flex:0 0 auto;min-width:92px;border:1px solid var(--g3);background:var(--card);border-radius:9px;padding:7px 9px;cursor:pointer;text-align:center;font-size:11px;font-weight:600;line-height:1.2}
.cattab .em{display:block;font-size:17px;margin-bottom:2px}
.cattab.on{background:var(--bk);color:#fff;border-color:var(--bk)}
.cattab.plus{min-width:54px;font-size:22px;font-weight:400;border-style:dashed;color:var(--mu)}
.cattab.plus:hover{border-color:var(--gr);color:var(--gr)}
/* tabelas */
.tw{overflow:auto;border-radius:9px;border:1px solid var(--g2)}
table.t{width:100%;border-collapse:collapse;background:var(--card)}
.t th{background:var(--bk);color:#fff;font-weight:600;font-size:11.5px;padding:8px 8px;text-align:left;white-space:nowrap;position:sticky;top:0;z-index:1}
.t th.s{cursor:pointer}
.t th.s:hover{background:var(--bk3)}
.t td{padding:7px 8px;border-bottom:1px solid var(--g2);vertical-align:middle}
.t tr:hover td{background:var(--hov)}
.t td.em{font-size:18px;text-align:center;width:36px}
.t .nm{font-weight:700}
.t input,.t select{border:1px solid var(--g3);border-radius:6px;padding:4px 6px;background:var(--card);width:100%}
.t input.n{width:76px;text-align:right}
.t tr.over td{background:var(--overbg)}
.t tr.over td:first-child{box-shadow:inset 3px 0 0 var(--re)}
.t tfoot td{font-weight:700;background:var(--g1)}
.empty{padding:26px;text-align:center;color:var(--mu)}
/* pílulas */
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 9px;font-size:11px;font-weight:700;white-space:nowrap}
.p-gr{background:var(--grl);color:#166534} .p-ye{background:var(--yel);color:#92400e} .p-re{background:var(--rel);color:#991b1b}
.p-gy{background:var(--g2);color:#4b5058} .p-bl{background:var(--bll);color:#1e40af} .p-bk{background:var(--bk);color:#fff}
.p-or{background:#ffe4d0;color:#9a3412}
.stbtns{display:inline-flex;gap:3px}
.stbtns button{border:1px solid var(--g3);background:var(--card);border-radius:6px;padding:2px 6px;cursor:pointer;font-size:13px;opacity:.35}
.stbtns button.on{opacity:1;border-color:var(--bk)}
.stbtns button.on.go{background:var(--grl);border-color:#86d3a0}
.stbtns button.on.pa{background:var(--yel);border-color:#f2c96e}
.stbtns button.on.de{background:var(--rel);border-color:#f0a3a3}
.pend{color:var(--ye);font-weight:700;cursor:help}
/* formulário */
.fg{display:grid;gap:10px}
.fl label{display:block;font-size:11px;color:var(--mu);font-weight:600;margin-bottom:3px}
.fl input,.fl select,.fl textarea{width:100%;border:1px solid var(--g3);border-radius:7px;padding:7px 9px;background:var(--card)}
.fl input:focus,.fl select:focus,.fl textarea:focus,.t input:focus,.t select:focus{outline:2px solid #bfe8cc;border-color:var(--gr)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sumline{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px dashed var(--g2)}
.sumtot{display:flex;justify-content:space-between;align-items:center;margin-top:8px;background:var(--rel);border-radius:8px;padding:10px 12px;font-weight:800}
.sumtot.ok{background:var(--grl)}
.sumtot span:last-child{font-size:19px}
.drop{border:2px dashed var(--g3);border-radius:10px;padding:18px;text-align:center;background:var(--g1)}
.drop > svg{width:40px;height:40px;color:var(--gr)}
/* AVISO (estilo nota técnica) */
.aviso{border:1px solid #f0bcbc;border-left:4px solid var(--re);background:#fdf2f2;border-radius:6px;padding:9px 12px;font-size:12px;margin:8px 0;color:#3a2020;line-height:1.45}
.aviso .lb{color:var(--re);font-weight:800;margin-right:6px;letter-spacing:.3px;white-space:nowrap}
.aviso.ok{border-color:#bfe5cb;border-left-color:var(--gr);background:#f0faf3;color:#173b25}.aviso.ok .lb{color:var(--grd)}
.aviso.at{border-color:#f3dba3;border-left-color:#e0a20f;background:#fff9ea;color:#4a3606}.aviso.at .lb{color:#b7791f}
.aviso.nt{border-color:#d9dde4;border-left-color:#6b7079;background:#f7f8fa;color:#33373d}.aviso.nt .lb{color:#4b5058}
/* imagem do produto */
.pimg{display:inline-grid;place-items:center;border-radius:9px;background:var(--imgbg);overflow:hidden;flex:0 0 auto;line-height:1;vertical-align:middle}
.pimg img{width:100%;height:100%;object-fit:contain;background:#fff}
.pimg.click{cursor:pointer;position:relative}.pimg.click:hover{outline:2px solid var(--gr)}
.t td.em{width:46px}
/* consumo rápido */
.cbar{display:flex;gap:10px;align-items:center;margin-bottom:10px}
.cbar .bigsearch{flex:1;position:relative}
.cbar .bigsearch input{width:100%;font-size:16px;padding:12px 14px 12px 42px;border:2px solid var(--bk);border-radius:10px}
.cbar .bigsearch svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:20px;height:20px}
.clist{display:flex;flex-direction:column;border:1px solid var(--g2);border-radius:10px;overflow:hidden;background:var(--card)}
.crow{display:grid;grid-template-columns:52px 1fr 130px 190px 110px;align-items:center;gap:10px;padding:7px 12px;border-bottom:1px solid var(--g2)}
.crow:last-child{border-bottom:0}
.crow.ch{background:var(--chbg)}
.crow .nm{font-weight:700;font-size:14px;cursor:pointer}
.step{display:inline-flex;align-items:center;border:1.5px solid var(--g3);border-radius:10px;overflow:hidden;background:var(--card)}
.step button{width:40px;height:38px;border:0;background:var(--g1);font-size:20px;cursor:pointer;font-weight:700;color:var(--tx)}
.step button:hover{background:var(--g2)}
.step button:active{background:var(--g3)}
.step input{width:64px;height:38px;border:0;text-align:center;font-size:17px;font-weight:800}
.step input:focus{outline:none;background:var(--chbg)}
.badge{font-weight:800;font-size:13px}
.sticky{position:sticky;bottom:-30px;margin:12px -15px -15px;padding:12px 15px;border-radius:0 0 var(--rad) var(--rad);background:var(--card);border-top:2px solid var(--bk);display:flex;gap:10px;align-items:center;z-index:5;box-shadow:0 -6px 16px rgba(0,0,0,.06)}
.chipf{border:1px solid var(--g3);background:var(--card);border-radius:999px;padding:5px 11px;cursor:pointer;font-size:12px;font-weight:600;white-space:nowrap}
.chipf.on{background:var(--bk);color:#fff;border-color:var(--bk)}
/* promoções */
.promo-lay{display:grid;grid-template-columns:minmax(0,1fr) 370px;gap:14px;align-items:start}
.pside{position:sticky;top:0}
.t tr.sel td{background:var(--selbg)}
.bigprice{font-size:28px;font-weight:800}
.cmp{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:8px}
.cmp td{padding:6px 4px;border-bottom:1px dashed var(--g2)}
.cmp td:last-child{text-align:right;font-weight:700}
.mkt{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--g2);font-size:12.5px}
.mkt:last-child{border-bottom:0}
.mkt a{margin-left:auto}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:10px}
.ftile{border:2px solid var(--g2);border-radius:10px;padding:8px;text-align:center;cursor:pointer;background:var(--card);font-size:11.5px;font-weight:600}
.ftile.on{border-color:var(--gr);box-shadow:0 0 0 3px #c9efd5}
.ftile .pimg{margin-bottom:5px}
.steps{list-style:none;padding:0;margin:0}
.steps li{display:flex;gap:9px;margin:7px 0;font-size:12px}
.steps li > b{background:var(--grl);color:#166534;border-radius:6px;width:20px;height:20px;display:grid;place-items:center;flex:0 0 20px;font-size:11px}
.alert{border-radius:6px;padding:9px 12px;font-size:12px;margin-bottom:10px;display:flex;gap:8px;align-items:center;border:1px solid transparent;border-left-width:4px}
.alert.r{border-color:#f0bcbc;border-left-color:var(--re)} .alert.y{border-color:#f3dba3;border-left-color:#e0a20f}
.alert.g{border-color:#bfe5cb;border-left-color:var(--gr)} .alert.b{border-color:#c9d8f7;border-left-color:var(--bl)}
.alert.y{background:var(--yel);color:#7c4a03}
.alert.r{background:var(--rel);color:#8f1c1c}
.alert.g{background:var(--grl);color:#14532d}
.alert.b{background:var(--bll);color:#1e3a8a}
.pinfo{display:flex;gap:12px;align-items:center}
.pinfo .big{font-size:40px;width:60px;height:60px;display:grid;place-items:center;background:var(--g1);border-radius:10px}
.mini4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px;text-align:center}
.mini4 div{background:var(--g1);border-radius:7px;padding:6px 4px}
.mini4 small{display:block;font-size:10px;color:var(--mu)}
.mini4 b{font-size:13.5px}
/* gráficos */
.chart{width:100%;height:200px;display:block}
.legend{display:flex;flex-direction:column;gap:6px;font-size:12px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
.hbar{display:grid;grid-template-columns:150px 1fr 64px;gap:8px;align-items:center;font-size:12px;margin:5px 0}
.hbar .tr{background:var(--g2);border-radius:5px;height:10px;overflow:hidden}
.hbar .fi{height:100%;border-radius:5px}
.nodata{display:grid;place-items:center;min-height:140px;color:var(--fa);font-weight:600;text-align:center}
/* modal */
.modal{position:fixed;inset:0;background:rgba(10,10,12,.5);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px}
.modal.hidden{display:none}
.mbox{background:var(--card);border-radius:12px;width:min(760px,100%);max-height:92vh;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.mbox.wide{width:min(1180px,100%)}
.mhead{display:flex;align-items:center;padding:14px 18px;border-bottom:1px solid var(--g2)}
.mhead h3{margin:0;font-size:15px}
.mhead .x{margin-left:auto;border:0;background:none;font-size:22px;cursor:pointer;color:var(--mu)}
.mbody{padding:16px 18px;overflow:auto}
.mfoot{padding:12px 18px;border-top:1px solid var(--g2);display:flex;gap:8px;justify-content:flex-end}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--bk);color:#fff;padding:10px 18px;border-radius:9px;font-weight:600;opacity:0;transition:.25s;pointer-events:none;z-index:60}
#toast.on{opacity:1}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.search{position:relative}
.search input{padding-left:30px}
.search svg{position:absolute;left:9px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--fa)}

/* ====== CELULAR ====== */
.mgear{display:none;border:0;background:none;padding:6px;cursor:pointer;place-items:center}
.nav .sh{display:none}
.mcard{display:grid;grid-template-columns:30px 46px 1fr auto;gap:10px;align-items:center;background:var(--card);border:1px solid var(--g2);border-radius:12px;padding:10px 12px;cursor:pointer}
.mcard input{width:22px;height:22px;accent-color:var(--gr)}
.mcard .nm{font-weight:800;font-size:15px}
.mcard.over{border-left:4px solid var(--re);background:var(--overbg)}
.mcard.done{opacity:.5}.mcard.done .nm{text-decoration:line-through}
@media (max-width: 820px){
  body{font-size:13.5px}
  .app{grid-template-columns:1fr;grid-template-rows:52px 1fr;height:100vh;height:100dvh}
  .top{grid-column:1;padding:0 10px 0 14px;gap:10px}.top svg{width:24px;height:24px}.top b{font-size:15px}.top small{display:none}
  .userbox{padding:4px}.userbox .uinfo{display:none}.mgear{display:grid}.menubtn{display:none}
  .app.mini{grid-template-columns:1fr}.app.mini .nav .lg{display:none}.app.mini .side{padding:4px 4px calc(4px + env(safe-area-inset-bottom))}.app.mini .nav{padding:7px 2px}
  .side{position:fixed;left:0;right:0;bottom:0;flex-direction:row;gap:0;padding:4px 4px calc(4px + env(safe-area-inset-bottom));z-index:30;border-top:1px solid var(--bk3);overflow-x:auto}
  .nav{flex:1 0 58px;flex-direction:column;gap:3px;padding:7px 2px;font-size:10.5px;text-align:center;justify-content:center;border-radius:10px}
  .nav svg{width:22px;height:22px;flex:0 0 22px}
  .nav .lg{display:none}.nav .sh{display:block}
  .side-foot{display:none}
  main{padding:12px 12px 16px;margin-bottom:64px}
  .ph{flex-wrap:wrap;gap:8px;margin-bottom:10px}.ph .ic{width:30px;height:30px}.ph h1{font-size:17px}.ph p{font-size:11.5px}
  .ph .acts{margin-left:0;width:100%;flex-wrap:wrap}.ph .acts .search{width:100%!important}
  .grid,.promo-lay{grid-template-columns:minmax(0,1fr)!important}
  .grid > *,.promo-lay > *{grid-column:auto!important;min-width:0}
  main,.card{min-width:0;max-width:100%}
  .bigtabs{grid-template-columns:repeat(3,minmax(0,1fr))}
  .bigtab b{font-size:13px}
  .row > .fl,.row > .search{flex:1 1 150px;min-width:0;width:auto!important}
  .row > .fl select,.row > .fl input{max-width:100%}
  .tw{max-width:100%}
  .tcompra thead{display:none}

  .tcompra td{border:0;padding:0;display:block;width:auto!important}
  .tcompra td.em{grid-row:1/3;align-self:start}
  .tcompra td:nth-child(2){grid-column:2/4;min-width:0!important}

  .tcompra td[data-l]{grid-column:span 1}

  .tcompra td[data-l] input{width:100%!important;text-align:left}
  .tcompra td[data-l="Marca"]{grid-column:2/3}.tcompra td[data-l="Qtd (emb.)"]{grid-column:3/4}
  .tcompra td[data-l="Conteúdo/emb."]{grid-column:2/3}.tcompra td[data-l="Preço unit."]{grid-column:3/4}
  .tcompra td[data-l="Valor total"]{grid-column:2/4;text-align:right}
  .kpis{grid-template-columns:repeat(2,1fr)!important;gap:8px}
  .kpi{padding:10px;gap:8px}.kpi .ki{display:none}.kpi .kv{font-size:16px}.kpi .ks{font-size:10px}
  .kpi.big{padding:8px 4px}.kpi.big .ki{display:block}.kpi.big .ki svg{width:22px;height:22px}.kpi.big .kv{font-size:20px}
  .bigtabs{gap:6px}.bigtab{padding:8px 4px}.bigtab small{display:none}.bigtab svg{width:22px;height:22px}
  .tabs{flex-wrap:nowrap;overflow-x:auto}.tab{padding:7px 10px;font-size:12px;flex:0 0 auto}
  .row{gap:6px}
  .crow{grid-template-columns:44px 1fr auto;column-gap:10px;row-gap:0;padding:9px 10px}
  .crow > div:nth-child(2){grid-column:2;grid-row:1}
  .crow > div:nth-child(3){grid-column:2;grid-row:2}
  .crow > div:nth-child(4){grid-column:3;grid-row:1/4}
  .crow > div:nth-child(4) > .small{display:none}
  .crow > .badge{grid-column:2;grid-row:3;font-size:12px}
  .crow > .pimg{grid-row:1/4}
  .step button{width:46px;height:46px;font-size:22px}.step input{width:52px;height:46px}
  .cbar{flex-wrap:wrap}.cbar .bigsearch{flex:1 1 100%}
  .sticky{flex-wrap:wrap;bottom:-16px;margin:12px -15px -15px}
  .sticky > span{flex:1 1 100%!important;white-space:normal!important}
  .modal{padding:0}.mbox,.mbox.wide{width:100%;max-height:100%;height:100%;border-radius:0}
  .pside{position:static}
  .mlist{display:flex;flex-direction:column;gap:8px}
  .lista-tw{display:none}
  .hbar{grid-template-columns:96px 1fr 62px}
  .fgrid{grid-template-columns:repeat(3,1fr)}
  .cattabs .cattab{min-width:80px}
  .card{padding:12px}
  .t td,.t th{padding:6px}
}
#printArea{display:none}
@media print{
  .app,#modal,#toast{display:none!important}
  #printArea{display:block;font-family:Arial,sans-serif;font-size:11pt;color:#000}
  #printArea h2{margin:0 0 4px;font-size:15pt}
  #printArea table{width:100%;border-collapse:collapse;margin-top:8px}
  #printArea th,#printArea td{border-bottom:1px solid #999;padding:4px 6px;text-align:left}
  #printArea th{border-bottom:2px solid #000}
  #printArea .bx{display:inline-block;width:13px;height:13px;border:1.5px solid #000}
  #printArea td{vertical-align:middle}
  #printArea .pimg{display:inline-grid;border-radius:5px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  #printArea .pimg img{width:100%;height:100%;object-fit:contain}
}

function seedProd(r, i, now){
  return {id: 'p' + String(i + 1).padStart(3, '0'), nome: r[1], cat: r[0], icon: r[5], status: 'GO',
    qtdIdeal: r[2], conteudo: r[3], prazo: r[4], minimo: null, marca: '', unidade: 'un',
    aplicacao: catOf(r[0]).apl, essencial: true, obs: r[6] || '', adicional: false, criado: now, atualizado: now};
}
function newDB(){
  const now = new Date().toISOString();
  return {
    versao: 1, criado: now,
    config: {vale: 950, meta: 600, reserva: null, diaCredito: 'ultimo', margem: 3},
    stores: STORES0.slice(),
    schema: 2,
    products: SEED.map((r, i) => seedProd(r, i, now)),
    movs: [],       // COMPRA / CONSUMO / AJUSTE
    notas: [],      // chaves de NF-e importadas
    plan: {},       // pid -> {ciclo: ISO início, em: data}
    prioOv: {},     // pid -> {prio, motivo, em}
    log: [],        // registro de ações (prioridade, planejamento, importações)
    dismissed: {},  // sugestões de catálogo dispensadas
    backups: [],
    promos: [],     // promoções coletadas
    storeLinks: {}, // link do encarte/site de cada mercado
  };
}
const KEY = 'homecontrol_db_v1';
let DB;
function load(){
  try { DB = JSON.parse(localStorage.getItem(KEY)); } catch(e) { DB = null; }
  if (!DB || !DB.products) { DB = newDB(); save(); }
  DB.config = Object.assign({vale:950, meta:600, reserva:null, diaCredito:'ultimo', margem:3}, DB.config || {});
  for (const k of ['movs','notas','log','backups','promos','users']) DB[k] = DB[k] || [];
  for (const k of ['plan','prioOv','dismissed','storeLinks']) DB[k] = DB[k] || {};
  for (const [k, v] of Object.entries(STORE_LINKS0)) if (!(k in DB.storeLinks)) DB.storeLinks[k] = v;
  if (!DB.schema || DB.schema < 2) {           // v0.3: Higiene Pessoal vira categoria 10; Adicionais passa a 11
    const now = new Date().toISOString();
    DB.products.forEach(p => { if (p.cat === 10) p.cat = ADIC; });
    const ex = new Set(DB.products.map(p => norm(p.nome)));
    SEED.forEach((r, i) => { if (r[0] === 10 && !ex.has(norm(r[1]))) { const np = seedProd(r, i, now); if (prodById(np.id)) np.id = uid('p'); DB.products.push(np); } });
    DB.schema = 2; save();
  }
}
function save(){
  try { localStorage.setItem(KEY, JSON.stringify(DB)); }
  catch(e) { alert('Não foi possível salvar os dados neste navegador: ' + e.message + '\nFaça um backup em "Dados, Excel e backup".'); }
}
function backup(motivo){
  const snap = JSON.parse(JSON.stringify(DB)); snap.backups = []; snap.products.forEach(p => delete p.foto); // fotos ficam fora dos backups automáticos (espaço)
  DB.backups.unshift({em: new Date().toISOString(), motivo, dados: JSON.stringify(snap)});
  DB.backups = DB.backups.slice(0, 8);
  save();
}

/* ====================================================================== CICLO DO VALE */
function creditDate(y, m){
  const last = new Date(y, m + 1, 0).getDate();
  const d = DB.config.diaCredito === 'ultimo' ? last : Math.min(+DB.config.diaCredito || last, last);
  return new Date(y, m, d);
}
function cycleOf(date){
  const t = new Date(date); t.setHours(0,0,0,0);
  let c = creditDate(t.getFullYear(), t.getMonth());
  if (t < c) c = creditDate(t.getFullYear(), t.getMonth() - 1);
  const next = creditDate(c.getFullYear(), c.getMonth() + 1);
  return {ini: c, fim: next};   // [ini, fim)
}
function cycleN(n){ let c = cycleOf(today0()); for (let i = 0; i < n; i++) c = cycleOf(c.fim); return c; }
const cycLabel = c => fdm(c.ini) + ' a ' + fdm(addDays(c.fim, -1));
const reserva = () => DB.config.reserva != null ? DB.config.reserva : DB.config.vale - DB.config.meta;

/* ====================================================================== UNIDADES E PREÇOS */
function parseContent(s){
  const m = String(s || '').toLowerCase().replace(',', '.').match(/(\d+(?:\.\d+)?)\s*(kg|g|l|ml|lt|litros?)\b/);
  if (!m) return null;
  const v = parseFloat(m[1]); const u = m[2];
  if (u === 'kg') return {v, base:'kg'}; if (u === 'g') return {v: v/1000, base:'kg'};
  if (u === 'ml') return {v: v/1000, base:'L'}; return {v, base:'L'};
}
function priceInfo(pid){
  const p = prodById(pid);
  const cs = DB.movs.filter(m => m.tipo === 'COMPRA' && m.pid === pid && m.precoUnit > 0).sort((a,b) => a.data < b.data ? -1 : 1);
  if (!cs.length) return {n:0};
  const pc = parseContent(p && p.conteudo);
  // unidade comparável: só normaliza quando todos os registros têm conteúdo com a mesma base
  const parsed = cs.map(m => parseContent(m.conteudo || (p && p.conteudo)));
  const base = parsed.every(x => x && x.base === parsed[0].base) ? parsed[0].base : null;
  const unitOf = (m, i) => base ? m.precoUnit / parsed[i].v : m.precoUnit;
  let best = null, bi = -1;
  cs.forEach((m, i) => { const u = unitOf(m, i); if (best == null || u < best) { best = u; bi = i; } });
  const last = cs[cs.length - 1], li = cs.length - 1;
  // média ponderada pela quantidade comparável
  let qn = 0, vt = 0;
  cs.forEach((m, i) => { const q = m.qtd * (base ? parsed[i].v : 1); qn += q; vt += m.total != null ? m.total : m.precoUnit * m.qtd; });
  const mediaUnit = qn ? vt / qn : null;
  const mediaEmb = base ? (pc && pc.base === base ? mediaUnit * pc.v : (vt / cs.reduce((s,m) => s + m.qtd, 0))) : mediaUnit;
  // melhor preço recente: últimos 90 dias
  const lim = addDays(today0(), -90).toISOString();
  let rb = null, ri = -1;
  cs.forEach((m, i) => { if (m.data >= lim) { const u = unitOf(m, i); if (rb == null || u < rb) { rb = u; ri = i; } } });
  const prev = cs.length > 1 ? unitOf(cs[li - 1], li - 1) : null;
  return {
    n: cs.length, base: base ? 'R$/' + base : 'R$/emb.', unidade: base ? base : 'emb.',
    best, bestLocal: cs[bi].local, bestData: cs[bi].data,
    recent: rb, recentLocal: ri >= 0 ? cs[ri].local : null, recentData: ri >= 0 ? cs[ri].data : null,
    last: unitOf(last, li), lastLocal: last.local, lastData: last.data, lastEmb: last.precoUnit,
    var: best ? (unitOf(last, li) / best - 1) : null, trend: prev ? unitOf(last, li) - prev : null,
    mediaEmb, mediaUnit, old: daysBetween(new Date(last.data), new Date()) > 90,
    bestEmb: cs[bi].precoUnit,
  };
}

let CACHE = null;
function computeAll(){
  const map = {};
  for (const p of DB.products) map[p.id] = {estoque:0, conferido:false, temMov:false, compras:[], consumos:[], ultCompra:null};
  // ordem cronológica: um AJUSTE fixa o saldo contado naquela data; o que vem depois soma/subtrai
  const ord = DB.movs.slice().sort((a, b) => a.data < b.data ? -1 : a.data > b.data ? 1 : (a.registrado || '') < (b.registrado || '') ? -1 : 1);
  for (const m of ord) {
    const s = map[m.pid]; if (!s) continue;
    if (m.tipo === 'AJUSTE' && m.novo != null) s.estoque = m.novo; else s.estoque += m.delta;
    s.temMov = true;
    if (m.tipo === 'AJUSTE') s.conferido = true;
    if (m.tipo === 'COMPRA') { s.compras.push(m); if (!s.ultCompra || m.data > s.ultCompra) s.ultCompra = m.data; }
    if (m.tipo === 'CONSUMO') s.consumos.push(m);
  }
  const t0 = today0();
  for (const p of DB.products) {
    const s = map[p.id];
    s.estoque = Math.round(s.estoque * 1000) / 1000;
    s.conhecido = s.conferido || s.temMov;
    // taxa de consumo
    let rate = null, fonte = null, conf = null;
    const lim = addDays(t0, -120).toISOString();
    const cons = s.consumos.filter(m => m.data >= lim);
    if (cons.length >= 2) {
      const first = cons.reduce((a, m) => m.data < a ? m.data : a, cons[0].data);
      const span = Math.max(7, daysBetween(new Date(first), new Date()));
      rate = cons.reduce((a, m) => a + m.qtd, 0) / span; fonte = 'consumo registrado'; conf = cons.length >= 5 ? 'alta' : 'média';
    } else if (s.compras.length >= 3) {
      const cs = s.compras.slice().sort((a,b) => a.data < b.data ? -1 : 1);
      const span = daysBetween(new Date(cs[0].data), new Date(cs[cs.length - 1].data));
      if (span >= 7) { rate = cs.slice(0, -1).reduce((a, m) => a + m.qtd, 0) / span; fonte = 'intervalo entre compras'; conf = 'média'; }
    }
    if (rate == null && p.qtdIdeal > 0 && p.prazo > 0) { rate = p.qtdIdeal / p.prazo; fonte = 'prazo cadastrado'; conf = 'baixa'; }
    s.rate = rate; s.fonte = fonte; s.confianca = conf;
    s.dias = (s.conhecido && rate > 0) ? Math.max(0, s.estoque) / rate : null;
    s.termino = s.dias != null ? addDays(t0, Math.floor(s.dias)) : null;
    // situação do estoque
    if (!s.conhecido) s.sit = 'pendente';
    else if (s.estoque <= 0) s.sit = 'zerado';
    else if ((p.minimo != null && s.estoque < p.minimo) || (s.dias != null && s.dias <= 7)) s.sit = 'baixo';
    else s.sit = 'ok';
    // frequência de compra
    let iv = null;
    if (s.compras.length >= 2) { const cs = s.compras.map(m => +new Date(m.data)).sort((a,b) => a-b); iv = (cs[cs.length-1] - cs[0]) / DAY / (cs.length - 1); }
    const ref = iv != null ? iv : p.prazo;
    s.freq = ref == null ? null : ref <= 10 ? 'Semanal' : ref <= 20 ? 'Quinzenal' : ref <= 45 ? 'Mensal' : ref <= 75 ? 'Bimestral' : ref <= 120 ? 'Trimestral' : 'Semestral';
    s.freqRef = iv == null;
    s.preco = priceInfo(p.id);

    else { qObs = 'Defina a quantidade ideal'; }
    if (qtd === 0 && s.estoque <= 0) qtd = 1;
    if (!p.conteudo) qObs = (qObs ? qObs + ' · ' : '') + 'confirmar peso/conteúdo';
    const pr = s.preco;
    const precoEmb = pr.n ? pr.mediaEmb : null;
    const valor = qtd != null && precoEmb != null ? qtd * precoEmb : null;
    // período sugerido
    let ciclo;
    if (prio === 'CRÍTICA' || prio === 'ALTA') ciclo = c0;
    else {
      const alvo = s.termino ? addDays(s.termino, -(DB.config.margem || 3)) : today0();
      ciclo = alvo < c0.fim ? c0 : cycleOf(alvo);
    }
    let planSt = 'Sugerido';
    const pl = DB.plan[p.id];
    if (pl) {
      const pc = cycleOf(new Date(pl.ciclo));
      if (pc.fim <= c0.ini) delete DB.plan[p.id];
      else { planSt = +pc.ini < +ciclo.ini ? 'Antecipado' : +pc.ini > +ciclo.ini ? 'Adiado' : 'Programado'; ciclo = pc; }
    }
    const risco = s.termino && +ciclo.ini > +s.termino;
    items.push({p, s, prio, prioCalc, motivo, qtd, qObs, precoEmb, valor, ciclo, atual: +ciclo.ini === +c0.ini, planSt, risco, pr});
  }
  const ord = (a, b) => PRIO.indexOf(a.prio) - PRIO.indexOf(b.prio) || ((a.s.dias ?? 999) - (b.s.dias ?? 999)) || a.p.nome.localeCompare(b.p.nome);
  items.sort(ord);
  // orçamento do ciclo atual: itens que excedem continuam visíveis
  const gasto = gastoCiclo(c0);
  let acc = 0; const saldo = DB.config.meta - gasto;
  for (const it of items.filter(i => i.atual)) {
    if (it.valor != null) acc += it.valor;
    it.acum = acc; it.excede = acc > saldo + 0.005 ? Math.min(it.valor || 0, acc - Math.max(saldo, 0)) : 0;
  }
  return {items, conferir, c0, c1, gasto, saldo, totalAtual: acc};
}
function gastoCiclo(c){
  return DB.movs.filter(m => m.tipo === 'COMPRA' && new Date(m.data) >= c.ini && new Date(m.data) < c.fim).reduce((a, m) => a + (m.total || 0), 0);
}

const JSQR_URL = 'https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js';
function loadJsQR(){
  if (window.jsQR) return Promise.resolve();
  return new Promise((res, rej) => { const sc = document.createElement('script'); sc.src = JSQR_URL; sc.onload = () => res(); sc.onerror = () => rej(new Error('sem internet para carregar o leitor de QR')); document.head.appendChild(sc); });
}
async function decodeQR(source){ // source: video, canvas ou imagem
  if ('BarcodeDetector' in window) {
    try { const bd = new BarcodeDetector({formats: ['qr_code']}); const r = await bd.detect(source); if (r[0]) return r[0].rawValue; return null; } catch(e) {}
  }
  await loadJsQR();
  const w = source.videoWidth || source.naturalWidth || source.width, h = source.videoHeight || source.naturalHeight || source.height;
  if (!w || !h) return null;
  const k = Math.min(1, 1000 / Math.max(w, h));
  const c = document.createElement('canvas'); c.width = Math.round(w * k); c.height = Math.round(h * k);
  const g = c.getContext('2d'); g.drawImage(source, 0, 0, c.width, c.height);
  const d = g.getImageData(0, 0, c.width, c.height); const r = window.jsQR(d.data, c.width, c.height);
  return r ? r.data : null;
}
function infoChave(ch){

}

// texto copiado da página de consulta da NFC-e (SEFAZ)
function parseSefazTexto(t){
  const re = /\(\s*C[óo]d(?:igo)?\.?\s*:?\s*([^)]*)\)\s*Qtde\.?\s*:?\s*([\d.,]+)\s*UN\.?\s*:?\s*([A-Za-zÀ-ú0-9]+)\s*Vl\.?\s*Unit\.?\s*:?\s*([\d.,]+)\s*Vl\.?\s*Total\s*:?\s*([\d.,]+)/gi;
  const itens = []; let m, prev = 0;
  while ((m = re.exec(t))) {
    const before = t.slice(prev, m.index).split(/\r?\n/).map(x => x.trim()).filter(Boolean);
    let desc = (before[before.length - 1] || '').replace(/^\d+\s*[-–]\s*/, '').trim();
    const q = pnum(m[2]), vu = pnum(m[4]), vt = pnum(m[5]);
    itens.push({usar: true, desc, qtd: q, unidade: m[3].toUpperCase(), preco: vu, total: vt, ean: m[1].trim(), marca: '',
      conteudo: (desc.match(/\d+(?:[.,]\d+)?\s*(?:kg|g|ml|l|lt)\b/i) || [''])[0], pid: matchProduct(desc)});
    prev = re.lastIndex;
  }
  if (!itens.length) return null;
  const g = r => { const x = t.match(r); return x ? x[1] : null; };
  const total = pnum(g(/Valor a pagar\s*R?\$?\s*:?\s*([\d.,]+)/i) || g(/Valor total\s*R?\$?\s*:?\s*([\d.,]+)/i));
  const desc = pnum(g(/Descontos?\s*R?\$?\s*:?\s*([\d.,]+)/i)) || 0;
  const dt = t.match(/Emiss[ãa]o\s*:?\s*(\d{2})\/(\d{2})\/(\d{4})\s*(\d{2}:\d{2})?/i);
  const chave = (g(/Chave de acesso\s*:?\s*([\d\s]{44,60})/i) || '').replace(/\D/g, '').slice(0, 44) || (UI.qrNota && UI.qrNota.chave) || '';
  const linhas = t.split(/\r?\n/).map(x => x.trim()).filter(Boolean);
  const iC = linhas.findIndex(l => /CNPJ/i.test(l));
  let loja = iC > 0 ? linhas[iC - 1] : (iC === 0 ? linhas[0].split(/CNPJ/i)[0] : '');
  loja = loja.replace(/^(DANFE.*|Documento Auxiliar.*)$/i, '').trim();
  const lojaN = DB.stores.find(s => norm(loja).includes(norm(s).split(' ')[0]) && norm(s).length > 2);
  return {chave, loja: lojaN || loja, numero: g(/N[úu]mero\s*:?\s*(\d+)/i) || (UI.qrNota && UI.qrNota.numero) || '',
    data: dt ? `${dt[3]}-${dt[2]}-${dt[1]}T${dt[4] || '12:00'}` : localISO(new Date()), vNF: total, vDesc: desc, itens};
}

async function colarCompra(){
  try {
    if (navigator.clipboard && navigator.clipboard.read) {
      const items = await navigator.clipboard.read();
      for (const it of items) {
        if (it.types.includes('text/plain')) return handlePasteText(await (await it.getType('text/plain')).text());
        if (it.types.some(t => t.startsWith('image/'))) return toast('Você copiou uma imagem. A leitura de foto de nota (OCR) ainda não está disponível — cole o XML ou uma lista em texto.');
      }
    }
    return handlePasteText(await navigator.clipboard.readText());
  } catch(e) { toast('O navegador não liberou a área de transferência. Clique na página e use Ctrl+V.'); }
}
function parseLinha(l){
  const cols = l.split(/\t|;|\|/).map(x => x.trim()).filter(Boolean);
  let nome = '', qtd = null, valor = null, marca = '', unit = null;
  if (cols.length > 1) {
    const nums = [], txts = [];
    cols.forEach(c => { const n = pnum(c.replace(/x$/i, '').replace(/^x/i, '')); if (n != null && /^[R$\s\d.,x]+$/i.test(c)) nums.push({c, n}); else txts.push(c); });
    nome = txts[0] || ''; marca = txts[1] || '';
    if (nums.length >= 3) { qtd = nums[0].n; unit = nums[1].n; valor = nums[2].n; }
    else if (nums.length === 2) { qtd = nums[0].n; valor = nums[1].n; }
    else if (nums.length === 1) { if (/,|R\$/.test(nums[0].c)) valor = nums[0].n; else qtd = nums[0].n; }
  } else {
    let x = cols[0] || '';
    const mq = x.match(/^(\d+(?:[.,]\d+)?)\s*(?:x|un|und|unid|unidades?)?\s+/i); if (mq) { qtd = pnum(mq[1]); x = x.slice(mq[0].length); }
    const mp = x.match(/\s+(?:R\$\s*)?(\d+[.,]\d{2})\s*$/); if (mp) { valor = pnum(mp[1]); x = x.slice(0, mp.index); }
    nome = x.replace(/[-–:]+$/, '').trim();
  }
  qtd = qtd || 1;
  return {nome, marca, qtd, valor, unit: unit != null ? unit : (valor != null ? valor / qtd : null)};
}
function handlePasteText(t){
  t = String(t || '').trim();
  if (!t) return toast('A área de transferência está vazia.');
  if (/<(infNFe|nfeProc|NFe)\b/.test(t)) return importXMLText(t);
  if (/Qtde\.?\s*:?/i.test(t) && /Vl\.?\s*Unit/i.test(t)) {
    const n = parseSefazTexto(t);
    if (n) { const dup = n.chave && DB.notas.find(x => x.chave === n.chave); UI.xml = Object.assign(n, {dup, origem: 'xml', numero: n.numero}); closeModal(); return xmlReview(); }
  }
  if (/^https?:\/\/\S+fazenda|\d{44}/.test(t) && t.length < 400) return qrLido(t);
  const lines = t.split(/\r?\n/).map(l => l.trim()).filter(l => l && !/^(produto|item|descri)/i.test(l));
  const itens = lines.map(parseLinha).filter(i => i.nome);
  if (!itens.length) return toast('Não reconheci itens no texto colado.');
  UI.xml = {chave:'', loja: (UI.draft && UI.draft.local) || DB.stores[0] || '', data: localISO(new Date()), numero:'', vNF: null, vDesc: 0, dup: null, origem: 'colado',
    itens: itens.map(i => ({usar: true, desc: i.nome, qtd: i.qtd, unidade: 'un', preco: i.unit, total: i.valor, marca: i.marca, conteudo: (i.nome.match(/\d+(?:[.,]\d+)?\s*(?:kg|g|ml|l|lt)\b/i) || [''])[0], pid: matchProduct(i.nome)}))};
  xmlReview();
}

function imgToData(src){
  return new Promise((res, rej) => {
    const im = new Image(); if (/^https?:/.test(src)) im.crossOrigin = 'anonymous';
    im.onload = () => { const S = 180, c = document.createElement('canvas'); c.width = c.height = S; const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, S, S);
      const r = Math.min(S / im.width, S / im.height) * .94; const w = im.width * r, h = im.height * r; g.drawImage(im, (S - w) / 2, (S - h) / 2, w, h);
      try { res(c.toDataURL('image/jpeg', .84)); } catch(e) { rej(e); } };
    im.onerror = () => rej(new Error('não foi possível carregar a imagem'));
    im.src = src;
  });
}
async function blobToFoto(blob){ if (!blob) return; const u = URL.createObjectURL(blob); try { setFoto(await imgToData(u)); } catch(e) { toast('Imagem inválida.'); } finally { URL.revokeObjectURL(u); } }
async function urlToFoto(u){

  catch(e) { setFoto(u); toast('O site não permite copiar a imagem; salvei o link (aparece só com internet).'); }
}

    for (const it of items) { const t = it.types.find(x => x.startsWith('image/')); if (t) return blobToFoto(await it.getType(t));

}

/* ---------- XML NF-e ---------- */
function pickFile(accept, cb){
  const f = $('#filePick'); f.value = ''; f.accept = accept;
  f.onchange = () => { if (f.files[0]) cb(f.files[0]); };
  f.click();

function txt(el, sel){ const e = el.getElementsByTagName(sel)[0]; return e ? e.textContent.trim() : ''; }
async function importXML(file){ return importXMLText(await file.text()); }
function importXMLText(s){
  const doc = new DOMParser().parseFromString(s, 'application/xml');
  if (doc.getElementsByTagName('parsererror').length) return toast('Arquivo XML inválido.');
  const inf = doc.getElementsByTagName('infNFe')[0];
  if (!inf) return toast('Não encontrei uma NF-e/NFC-e neste XML.');
  const chave = (inf.getAttribute('Id') || '').replace(/^NFe/, '');
  const emit = doc.getElementsByTagName('emit')[0];
  const loja = emit ? (txt(emit, 'xFant') || txt(emit, 'xNome')) : '';
  const ide = doc.getElementsByTagName('ide')[0];
  const dh = ide ? (txt(ide, 'dhEmi') || txt(ide, 'dEmi')) : '';
  const numero = ide ? txt(ide, 'nNF') : '';
  const vNF = pnum(txt(doc, 'vNF'));
  const vDesc = pnum(txt(doc.getElementsByTagName('ICMSTot')[0] || doc, 'vDesc')) || 0;
  const itens = [...doc.getElementsByTagName('det')].map(det => {
    const pr = det.getElementsByTagName('prod')[0];
    const desc = txt(pr, 'xProd'); const q = pnum(txt(pr, 'qCom')); const vu = pnum(txt(pr, 'vUnCom')); const vp = pnum(txt(pr, 'vProd'));
    const vd = pnum(txt(pr, 'vDesc')) || 0;
    return {usar: true, desc, qtd: q, unidade: txt(pr, 'uCom'), preco: vu, total: vp != null ? Math.round((vp - vd) * 100) / 100 : null, ean: txt(pr, 'cEAN'),
      marca: '', conteudo: (desc.match(/\d+(?:[.,]\d+)?\s*(?:kg|g|ml|l|lt)\b/i) || [''])[0], pid: matchProduct(desc)};
  });
  const dup = DB.notas.find(n => (chave && n.chave === chave) || (n.numero === numero && norm(n.loja) === norm(loja) && n.total === vNF && n.data && dh && n.data.slice(0,10) === dh.slice(0,10)));
  UI.xml = {chave, loja, data: dh ? localISO(new Date(dh)) : localISO(new Date()), numero, vNF, vDesc, itens, dup, origem: 'xml'};
  xmlReview();
}
function matchProduct(desc){
  const d = ' ' + norm(desc) + ' ';
  let best = null, bl = 0;
  for (const p of DB.products) {
    const n = norm(p.nome.replace(/\(.*?\)/g, ''));
    const first = n.split(' ')[0];
    if (n.length > 2 && d.includes(' ' + n + ' ') && n.length > bl) { best = p.id; bl = n.length; }
    else if (!best && first.length > 3 && d.includes(' ' + first + ' ') && first.length > bl) { best = p.id; bl = first.length; }
  }
  return best || '';
}
function xmlReview(){
  const x = UI.xml;
  const soma = x.itens.reduce((a, i) => a + (i.total || 0), 0);
  const somaUsar = x.itens.filter(i => i.usar).reduce((a, i) => a + (i.total || 0), 0);
  const ok = x.vNF == null || Math.abs(soma - x.vNF) < 0.05;
  const rows = x.itens.map((it, i) => `<tr style="${it.usar ? '' : 'opacity:.45'}">
    <td><input type="checkbox" ${it.usar ? 'checked' : ''} onchange="UI.xml.itens[${i}].usar=this.checked;xmlReview()" style="width:auto"></td>
    <td class="small"><input value="${esc(it.desc)}" oninput="UI.xml.itens[${i}].desc=this.value" style="min-width:180px"></td>
    <td style="min-width:170px"><select onchange="xmlAssoc(${i},this.value)">${prodOptions(it.pid)}</select>${it.pid ? '' : '<div class="small pend">associe ou cadastre</div>'}</td>
    <td><input class="n" style="width:60px" value="${fnum(it.qtd,3)}" oninput="UI.xml.itens[${i}].qtd=pnum(this.value)"></td>
    <td><input value="${esc(it.unidade)}" style="width:46px" oninput="UI.xml.itens[${i}].unidade=this.value"></td>
    <td><input value="${esc(it.conteudo)}" style="width:70px" placeholder="—" oninput="UI.xml.itens[${i}].conteudo=this.value"></td>
    <td><input value="${esc(it.marca)}" style="width:80px" placeholder="—" oninput="UI.xml.itens[${i}].marca=this.value"></td>
    <td><input class="n" value="${it.preco != null ? fnum(it.preco, 4) : ''}" oninput="UI.xml.itens[${i}].preco=pnum(this.value)"></td>
    <td><input class="n" value="${it.total != null ? fnum(it.total) : ''}" oninput="UI.xml.itens[${i}].total=pnum(this.value)"></td></tr>`).join('');
  const body = `${x.dup ? `<div class="alert r">${IC.warn.replace('<svg','<svg width="18"')} Possível nota duplicada: já importada em ${fdt(x.dup.em)} (${esc(x.dup.loja)}, nº ${esc(x.dup.numero)}).</div>` : ''}
    <div class="grid" style="grid-template-columns:2fr 1.3fr 1fr 1fr;margin-bottom:10px">
      <div class="fl"><label>Estabelecimento</label><input value="${esc(x.loja)}" oninput="UI.xml.loja=this.value"></div>
      <div class="fl"><label>Data/hora</label><input type="datetime-local" value="${x.data}" onchange="UI.xml.data=this.value"></div>
      <div class="fl"><label>Nº da nota</label><input disabled value="${esc(x.numero)}"></div>
      <div class="fl"><label>Total da nota</label><input disabled value="${brl(x.vNF)}"></div></div>
    <div class="alert ${ok ? 'g' : 'y'}">Soma dos itens: <b>${brl(soma)}</b> · total da nota: <b>${brl(x.vNF)}</b> ${ok ? '✓ confere' : '— diferença de ' + brl((x.vNF || 0) - soma) + (x.vDesc ? ' (desconto geral de ' + brl(x.vDesc) + ')' : '')}. Itens marcados para gravar: <b>${brl(somaUsar)}</b></div>
    <div style="font-weight:700;margin-bottom:6px">Itens identificados (${x.itens.length})</div>
    <div class="tw" style="max-height:48vh"><table class="t"><thead><tr><th></th><th>Descrição na nota</th><th>Produto do catálogo</th><th>Qtd</th><th>Un.</th><th>Conteúdo</th><th>Marca</th><th>Preço unit.</th><th>Total</th></tr></thead><tbody>${rows}</tbody></table></div>
    <div class="small muted" style="margin-top:6px">Desmarque itens não domésticos para ignorá-los. Nada é gravado antes de você confirmar.</div>`;
  modal(x.origem === 'colado' ? 'Revisar itens colados' : 'Revisar nota fiscal', body, `<button class="btn" onclick="closeModal()">Cancelar</button><button class="btn green" onclick="confirmXML()">${IC.check} Confirmar e atualizar estoque</button>`, true);
}
function xmlAssoc(i, v){
  const it = UI.xml.itens[i];
  if (v === '__novo') { newProductModal({cat:ADIC, adicional:true, nome: it.desc, back: xmlReview, onSave: p => { it.pid = p.id; xmlReview(); }}); return; }

function confirmXML(){
  const x = UI.xml; const us = x.itens.filter(i => i.usar);
  const sem = us.filter(i => !i.pid);
  if (sem.length) return toast(sem.length + ' item(ns) marcado(s) sem produto associado.');
  if (us.some(i => !(i.qtd > 0))) return toast('Há item sem quantidade.');
  if (!x.loja.trim()) return toast('Informe o estabelecimento.');
  backup('Antes de importar nota fiscal');
  const loja = DB.stores.find(s => norm(s) === norm(x.loja)) || x.loja.trim();
  UI.draft = {local: loja, data: x.data, obs: 'NF ' + (x.numero || ''), lines: us.map(i => ({pid: i.pid, qtd: i.qtd, conteudo: i.conteudo, marca: i.marca,
    preco: i.total != null && i.qtd ? Math.round(i.total / i.qtd * 10000) / 10000 : i.preco}))};
  if (x.origem === 'xml') { DB.notas.push({chave: x.chave, numero: x.numero, loja: x.loja, total: x.vNF, data: new Date(x.data).toISOString(), em: new Date().toISOString()});
  logAct('NF-e', 'Nota ' + (x.numero || x.chave) + ' importada com ' + us.length + ' itens'); }
  const og = x.origem; UI.xml = null;
  doCompra(og);
}

function sortRows(rows, sort, getters){

  const g = getters[sort.k];
  return rows.slice().sort((a, b) => { const x = g(a), y = g(b); return (typeof x === 'string' ? x.localeCompare(y) : x - y) * sort.d; });
}

function similar(nome, exceptId){

function newProductModal(opt = {}){

function pgPrecos(){
  const F = UI.priceF;
  const lim = F.per ? addDays(today0(), -F.per).toISOString() : '';
  let rows = DB.products.filter(p => ST(p.id).preco.n).map(p => {
    let pr = ST(p.id).preco;
    if (F.loja || lim) {
      const ms = DB.movs.filter(m => m.tipo === 'COMPRA' && m.pid === p.id && m.precoUnit > 0 && (!F.loja || m.local === F.loja) && (!lim || m.data >= lim));
      if (!ms.length) return null;
      const keep = DB.movs; DB.movs = ms; pr = priceInfo(p.id); DB.movs = keep;
    }
    return {p, pr};
  }).filter(Boolean);
  if (F.q) rows = rows.filter(r => norm(r.p.nome + ' ' + r.p.marca).includes(norm(F.q)));
  if (F.cat) rows = rows.filter(r => r.p.cat === +F.cat);
  const keyF = {menor: r => r.pr.best, ultimo: r => -new Date(r.pr.lastData), variacao: r => -(r.pr.var || 0)}[UI.priceMode];
  rows.sort((a, b) => keyF(a) - keyF(b));
  const u = (v, pr) => pr.base === 'R$/emb.' ? brl(v) : brl(v) + '<span class="small muted">/' + pr.unidade + '</span>';
  const tb = rows.map(({p, pr}) => {
    const tr = pr.trend == null ? '<span class="faint">—</span>' : pr.trend > 0.005 ? '<span class="c-re nm">↗ Em alta</span>' : pr.trend < -0.005 ? '<span class="c-gr nm">↘ Em queda</span>' : '<span class="muted nm">↔ Estável</span>';
    return `<tr><td class="em">${pimg(p)}</td><td class="nm">${esc(p.nome)}</td><td>${pr.base}</td>
      <td><span class="pill p-gr">${u(pr.best, pr)}</span></td><td>${esc(pr.bestLocal)}</td><td>${fdate(pr.bestData)}</td>
      <td>${pr.recent != null ? u(pr.recent, pr) + ' <span class="small muted">' + esc(pr.recentLocal) + '</span>' : '<span class="faint small">sem compra em 90 dias</span>'}</td>
      <td class="nm">${u(pr.last, pr)}</td><td>${esc(pr.lastLocal)}</td><td>${fdate(pr.lastData)}${pr.old ? ' <span class="pill p-ye" title="Último registro com mais de 90 dias">antigo</span>' : ''}</td>
      <td class="right ${pr.var > 0.005 ? 'c-re' : 'muted'} nm">${pr.var != null ? (pr.var > 0 ? '+' : '') + fnum(pr.var * 100, 1) + '%' : '—'}</td>
      <td class="center">${pr.n}${pr.n < 3 ? ' <span class="pill p-gy" title="Poucos registros para comparar">amostra pequena</span>' : ''}</td><td>${tr}</td></tr>`;
  }).join('');
  // concentração de compras por loja
  const lojaWins = {};
  DB.products.forEach(p => { const pr = ST(p.id).preco; if (pr.n >= 2 && pr.recent != null) lojaWins[pr.recentLocal] = (lojaWins[pr.recentLocal] || 0) + 1; });
  const topLoja = Object.entries(lojaWins).sort((a, b) => b[1] - a[1])[0];
  return header('precos', 'Comparativo de preços por produto e estabelecimento',
     `<div class="tabs" style="margin:0">${[['menor','Menor Preço'],['ultimo','Último Preço'],['variacao','Variação']].map(([k, l]) => `<div class="tab ${UI.priceMode === k ? 'on g' : ''}" onclick="UI.priceMode='${k}';render()">${l}</div>`).join('')}</div>`)
   + `<div class="row" style="margin-bottom:12px">
      <div class="search fl" style="width:260px">${IC.search}<input placeholder="Buscar produto…" value="${esc(F.q)}" onchange="UI.priceF.q=this.value;render()"></div>
      <div class="fl"><select onchange="UI.priceF.cat=this.value;render()"><option value="">Todas as categorias</option>${CATS.map(c => `<option value="${c.id}" ${+F.cat === c.id ? 'selected' : ''}>${esc(c.nome)}</option>`).join('')}</select></div>
      <div class="fl"><select onchange="UI.priceF.loja=this.value;render()"><option value="">Todos os estabelecimentos</option>${DB.stores.map(s => `<option ${F.loja === s ? 'selected' : ''}>${esc(s)}</option>`).join('')}</select></div>
      <div class="fl"><select onchange="UI.priceF.per=+this.value||'';render()"><option value="">Todo o período</option>${[[30,'Últimos 30 dias'],[90,'Últimos 90 dias'],[180,'Últimos 6 meses'],[365,'Último ano']].map(([d, l]) => `<option value="${d}" ${+F.per === d ? 'selected' : ''}>${l}</option>`).join('')}</select></div>
    </div>
    ${topLoja && topLoja[1] >= 3 ? `<div class="alert g">💡 ${topLoja[1]} produtos têm o melhor preço recente em <b>${esc(topLoja[0])}</b>: concentrar a compra lá pode economizar (avalie também a distância/conveniência).</div>` : ''}
    <div class="tw"><table class="t"><thead><tr><th></th><th>Produto</th><th>Unidade</th><th>Menor preço (histórico)</th><th>Estabelecimento</th><th>Data do menor</th><th>Melhor recente (90 d)</th><th>Último preço</th><th>Último local</th><th>Última compra</th><th class="right">Variação</th><th class="center">Registros</th><th>Tendência</th></tr></thead>
    <tbody>${tb || `<tr><td colspan="13" class="empty">Sem dados suficientes. A tabela é alimentada automaticamente pelas compras confirmadas (com preço).</td></tr>`}</tbody></table></div>
    <div class="small muted" style="margin-top:8px">Preços em R$/kg ou R$/L só quando todas as compras do produto têm peso/conteúdo informado; caso contrário a comparação é por embalagem (R$/emb.). Variação = último preço em relação ao menor preço histórico.</div>`;
}

const AV = { // nível: classe de aviso, pílula, rótulo
  melhor: ['ok', 'p-gr', 'Melhor preço'], vale: ['ok', 'p-gr', 'Vale a pena'], media: ['at', 'p-ye', 'Na média'],
  caro: ['', 'p-re', 'Não compensa'], semhist: ['nt', 'p-gy', 'Sem histórico'], fora: ['nt', 'p-bl', 'Fora do catálogo'], vencida: ['', 'p-re', 'Vencida'],
};
const promoVencida = pr => pr.validade && new Date(pr.validade + 'T23:59:59') < new Date();
function aviso(cls, label, html){ return `<div class="aviso ${cls}"><span class="lb">${label}</span>${html}</div>`; }
function avaliarPromo(pr, P){
  const p = prodById(pr.pid);
  const out = {av: 'semhist', avisos: [], cmp: null};
  if (promoVencida(pr)) { out.av = 'vencida'; out.avisos.push(['', '⚠ AVISO', `Promoção vencida em ${fdate(pr.validade + 'T12:00')}. Confira se ainda vale no mercado.`]); }
  if (!p) { if (out.av !== 'vencida') out.av = 'fora'; out.avisos.push(['nt', 'ℹ NOTA', 'Este item não está ligado a um produto do seu catálogo. Associe abaixo para comparar com o seu histórico.']); return out; }
  const s = ST(p.id), hi = s.preco;
  const pc = parseContent(pr.conteudo || p.conteudo), pcProd = parseContent(p.conteudo);
  let promoCmp = pr.preco, media = null, best = null, last = null, un = 'emb.';

function donutSVG(parts, total, label){
  const sum = parts.reduce((a, p) => a + p[0], 0);
  if (!sum) return '<div class="nodata">Sem dados suficientes</div>';
  let a0 = -Math.PI / 2; const R = 62, r = 44, cx = 75, cy = 75;
  const segs = parts.filter(p => p[0] > 0).map(p => {
    const a1 = a0 + p[0] / sum * Math.PI * 2 - (p[0] === sum ? 1e-4 : 0);
    const L = a1 - a0 > Math.PI ? 1 : 0;
    const P = (rr, a) => (cx + rr * Math.cos(a)).toFixed(2) + ' ' + (cy + rr * Math.sin(a)).toFixed(2);
    const d = `M${P(R, a0)} A${R} ${R} 0 ${L} 1 ${P(R, a1)} L${P(r, a1)} A${r} ${r} 0 ${L} 0 ${P(r, a0)} Z`;
    a0 = a1; return `<path d="${d}" fill="${p[1]}"/>`;
  }).join('');
  return `<div class="row" style="gap:16px;flex-wrap:nowrap"><svg class="donut" viewBox="0 0 150 150" width="150" height="150">${segs}<text x="75" y="74" text-anchor="middle" font-size="24" font-weight="800">${total}</text><text x="75" y="92" text-anchor="middle" font-size="10" fill="#6b7079">${label}</text></svg>
    <div class="legend">${parts.map(p => `<div><i style="background:${p[1]}"></i>${p[2]} <b>${p[0]}</b> <span class="muted">(${fnum(p[0] / sum * 100, 1)}%)</span></div>`).join('')}</div></div>`;
}
function barsSVG(data, colors, meta, money){
  const W = 360, H = 170, pad = 26, max = Math.max(1, meta || 0, ...data.map(d => d[1])) * 1.12;
  const bw = (W - pad * 2) / data.length;
  const bars = data.map((d, i) => {
    const h = d[1] / max * (H - 44); const x = pad + i * bw + bw * .18; const y = H - 22 - h;
    const col = meta && d[1] > meta ? '#dc2626' : colors[i % colors.length];
    return `<rect x="${x}" y="${y}" width="${bw * .64}" height="${h}" rx="3" fill="${col}"/><text x="${x + bw * .32}" y="${y - 4}" text-anchor="middle" font-size="10" font-weight="700">${money ? 'R$' + Math.round(d[1]) : d[1]}</text><text x="${x + bw * .32}" y="${H - 7}" text-anchor="middle" font-size="9.5" fill="#6b7079">${esc(d[0])}</text>`;
  }).join('');
  const ml = meta ? `<line x1="${pad}" x2="${W - pad}" y1="${H - 22 - meta / max * (H - 44)}" y2="${H - 22 - meta / max * (H - 44)}" stroke="#d97706" stroke-dasharray="5 4" stroke-width="1.5"/><text x="${W - pad}" y="${H - 26 - meta / max * (H - 44)}" text-anchor="end" font-size="9.5" fill="#d97706">meta ${brl(meta)}</text>` : '';
  return `<svg class="chart" viewBox="0 0 ${W} ${H}">${bars}${ml}<line x1="${pad}" x2="${W - pad}" y1="${H - 22}" y2="${H - 22}" stroke="#d3d6dc"/></svg>`;
}
function lineSVG(data, meta){
  const W = 360, H = 170, pad = 30, max = Math.max(meta, ...data.map(d => d[1])) * 1.15;
  const X = i => pad + i * (W - pad * 2) / (data.length - 1), Y = v => H - 22 - v / max * (H - 44);
  const pts = data.map((d, i) => X(i).toFixed(1) + ',' + Y(d[1]).toFixed(1)).join(' ');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}"><line x1="${pad}" x2="${W - pad}" y1="${Y(meta)}" y2="${Y(meta)}" stroke="#d97706" stroke-dasharray="5 4" stroke-width="1.5"/><text x="${W - pad}" y="${Y(meta) - 4}" text-anchor="end" font-size="9.5" fill="#d97706">meta</text>
    <polyline points="${pts}" fill="none" stroke="#64748b" stroke-width="2.2"/>${data.map((d, i) => `<circle cx="${X(i)}" cy="${Y(d[1])}" r="3.5" fill="${d[1] > meta ? '#dc2626' : '#16a34a'}"/><text x="${X(i)}" y="${Y(d[1]) - 7}" text-anchor="middle" font-size="9.5" font-weight="700">${Math.round(d[1])}</text><text x="${X(i)}" y="${H - 7}" text-anchor="middle" font-size="9.5" fill="#6b7079">${d[0]}</text>`).join('')}
    <line x1="${pad}" x2="${W - pad}" y1="${H - 22}" y2="${H - 22}" stroke="#d3d6dc"/></svg>`;
}

    lh.setUint32(0, 0x04034b50, true); lh.setUint16(4, 20, true); lh.setUint16(6, 0x0800, true); lh.setUint16(8, 0, true);
    lh.setUint32(14, crc, true); lh.setUint32(18, db.length, true); lh.setUint32(22, db.length, true); lh.setUint16(26, nb.length, true);

async function unzip(buf){
  const dv = new DataView(buf); const u8 = new Uint8Array(buf); const out = {};
  let e = buf.byteLength - 22; while (e >= 0 && dv.getUint32(e, true) !== 0x06054b50) e--;
  if (e < 0) throw new Error('arquivo não é um .xlsx válido');
  const n = dv.getUint16(e + 10, true); let p = dv.getUint32(e + 16, true);
  const dec = new TextDecoder();
  for (let i = 0; i < n; i++) {
    const method = dv.getUint16(p + 10, true), csize = dv.getUint32(p + 20, true), nl = dv.getUint16(p + 28, true), xl = dv.getUint16(p + 30, true), cl = dv.getUint16(p + 32, true), lo = dv.getUint32(p + 42, true);
    const name = dec.decode(u8.subarray(p + 46, p + 46 + nl));
    const lnl = dv.getUint16(lo + 26, true), lxl = dv.getUint16(lo + 28, true);
    const data = u8.subarray(lo + 30 + lnl + lxl, lo + 30 + lnl + lxl + csize);
    if (method === 0) out[name] = data;
    else if (method === 8) { const ds = new DecompressionStream('deflate-raw'); out[name] = new Uint8Array(await new Response(new Blob([data]).stream().pipeThrough(ds)).arrayBuffer()); }
    p += 46 + nl + xl + cl;
  }
  return out;
}
async function readXlsx(file){
  const z = await unzip(await file.arrayBuffer()); const dec = new TextDecoder(); const X = n => z[n] ? new DOMParser().parseFromString(dec.decode(z[n]), 'application/xml') : null;
  const wb = X('xl/workbook.xml'), rels = X('xl/_rels/workbook.xml.rels'), sst = X('xl/sharedStrings.xml');
  const strings = sst ? [...sst.getElementsByTagName('si')].map(si => [...si.getElementsByTagName('t')].map(t => t.textContent).join('')) : [];
  const relMap = {}; [...rels.getElementsByTagName('Relationship')].forEach(r => relMap[r.getAttribute('Id')] = r.getAttribute('Target'));
  const sheets = {};
  for (const s of wb.getElementsByTagName('sheet')) {
    const rid = s.getAttribute('r:id') || s.getAttributeNS('http://schemas.openxmlformats.org/officeDocument/2006/relationships', 'id');
    let t = relMap[rid]; if (!t) continue; t = t.replace(/^\/?xl\//, '').replace(/^\//, ''); const doc = X('xl/' + t); if (!doc) continue;
    const rows = [];
    for (const r of doc.getElementsByTagName('row')) {
      const ri = +r.getAttribute('r') - 1; const row = rows[ri] = [];
      for (const c of r.getElementsByTagName('c')) {
        const ref = c.getAttribute('r'); const col = ref.replace(/\d+/g, '').split('').reduce((a, ch) => a * 26 + ch.charCodeAt(0) - 64, 0) - 1;
        const t2 = c.getAttribute('t'); const v = c.getElementsByTagName('v')[0];
        let val = null;
        if (t2 === 's') val = strings[+v.textContent];
        else if (t2 === 'inlineStr') val = [...c.getElementsByTagName('t')].map(x => x.textContent).join('');
        else if (t2 === 'str' || t2 === 'e') val = v ? v.textContent : null;
        else if (t2 === 'b') val = v ? v.textContent === '1' : null;
        else val = v ? +v.textContent : null;
        row[col] = val;
      }
    }
    sheets[s.getAttribute('name')] = rows;
  }
  return sheets;
}
async function importXlsx(file){

  const ci = name => head.indexOf(norm(name));
  const need = ['ID','Produto','Categoria','Status','Estoque atual'];
  const miss = need.filter(n => ci(n) < 0); if (miss.length) return alert('Colunas não encontradas na aba Produtos: ' + miss.join(', '));
  const cfgRows = sh['Config'] || [];
  const getCfg = label => { const r = cfgRows.find(r => r && norm(r[0]).startsWith(norm(label))); return r ? r[1] : undefined; };
  const exportedAt = getCfg('Exportado em');
  const changes = [], news = [], conflicts = [], problems = [];
  const stMap = {go:'GO', normal:'GO', pausado:'PAUSA', pausa:'PAUSA', descontinuado:'DESC'};
  const parseCat = v => { if (v == null) return null; const n = parseInt(v); if (n >= 1 && n <= CATS.length) return n; const c = CATS.find(c => norm(c.nome) === norm(v) || norm(c.curto) === norm(v)); return c ? c.id : null; };
  const numOrNull = v => (v == null || v === '' || norm(v) === 'x') ? null : (typeof v === 'number' ? v : pnum(v));

  const seen = new Set();
  pr.slice(1).forEach((r, k) => {
    if (!r || !r.some(v => v != null && v !== '')) return;
    const line = k + 2;
    const g = n => ci(n) >= 0 ? r[ci(n)] : undefined;
    const nome = String(g('Produto') ?? '').trim(); if (!nome) { problems.push('Linha ' + line + ': sem nome — ignorada.'); return; }
    const f = {nome, cat: parseCat(g('Categoria')), status: stMap[norm(g('Status'))] || null, marca: String(g('Marca habitual') ?? '').trim(),
      qtdIdeal: numOrNull(g('QTD ideal')), conteudo: (g('Peso/conteúdo') == null || norm(g('Peso/conteúdo')) === 'x') ? '' : String(g('Peso/conteúdo')).trim(),
      prazo: numOrNull(g('Prazo (dias)')), minimo: numOrNull(g('Estoque mínimo')), unidade: String(g('Unidade') ?? 'un').trim() || 'un',
      aplicacao: String(g('Aplicação') ?? '').trim(), essencial: norm(g('Essencial')) !== 'nao', obs: String(g('Observações') ?? '').trim(), icon: String(g('Ícone') ?? '').trim()};
    if (!f.cat) { problems.push('Linha ' + line + ' (' + nome + '): categoria inválida — ignorada.'); return; }
    if (!f.status) { problems.push('Linha ' + line + ' (' + nome + '): status "' + g('Status') + '" inválido — mantido o atual.'); }
    const est = numOrNull(g('Estoque atual'));
    const id = String(g('ID') ?? '').trim();
    const p = id ? prodById(id) : null;
    if (id && seen.has(id)) { problems.push('Linha ' + line + ': ID ' + id + ' repetido — ignorada.'); return; }

      if (String(f[k2] ?? '') !== String(p[k2] ?? '')) diffs.push({k: k2, de: p[k2], para: f[k2]});
    }
    const s = ST(p.id);
    let estCh = null;
    if (est != null && (!s.conhecido || Math.abs(est - s.estoque) > 1e-9)) estCh = {de: s.conhecido ? s.estoque : null, para: est};
    if (est == null && s.conhecido) problems.push(p.nome + ': estoque vazio no Excel — mantido ' + fnum(s.estoque) + ' do app.');

  if (cv.reserva !== undefined) cv.reserva = (cv.reserva == null || cv.reserva === '') ? null : numOrNull(cv.reserva);

  UI.imp = {changes: conflicts.concat(changes), news, problems, cfgCh, cfgApply: true, exportedAt, file: file.name};

}
function userMenu(){
  modal('Usuário', `<div class="pinfo"><span class="avatar" style="width:48px;height:48px;font-size:17px;background:var(--bk);color:#fff">${esc(initials(USER.nome))}</span><div><b style="font-size:16px">${esc(USER.nome)}</b><div class="muted">${esc(USER.email)}</div></div></div>
    <div class="fg" style="margin-top:14px"><div class="fl"><label>Nome</label><input id="us_nome" value="${esc(USER.nome)}"></div></div>
    <div class="small muted" style="margin-top:10px">Usuários cadastrados neste aparelho: ${DB.users.map(u => esc(u.nome)).join(', ')}</div>`,
    `<button class="btn red" style="margin-right:auto" onclick="sair()">Sair / trocar usuário</button><button class="btn" onclick="closeModal()">Fechar</button><button class="btn green" onclick="USER.nome=$('#us_nome').value.trim()||USER.nome;save();closeModal();renderUser()">Salvar</button>`);
}
function sair(){ try { localStorage.removeItem(SKEY); sessionStorage.removeItem(SKEY); } catch(e) {} USER = null; closeModal(); renderUser(); showLogin(); }
const quem = () => USER ? USER.nome : '';

/* ====================================================================== INÍCIO */
load();
initMenu();
setTema(temaAtual());
loadSession();
renderUser();
render();
if (!USER) showLogin();

if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
